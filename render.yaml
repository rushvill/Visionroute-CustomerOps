# Render Blueprint — VisionRoute Customer Ops API + Postgres (free-tier friendly)
#
# API image is built on GitHub Actions (more RAM), then Render only runs it.
# After the first green "api-image" workflow, Manual Sync this blueprint.
#
# Set BOOTSTRAP_ADMIN_PASSWORD on first apply; delete after first admin login.

databases:
  - name: customerops-db
    plan: free
    databaseName: customerops
    user: customerops
    region: oregon

services:
  - type: web
    name: customerops-api
    runtime: image
    plan: free
    region: oregon
    image:
      url: ghcr.io/rushvill/customerops-api:latest
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: RUST_LOG
        value: customer_ops_api=info,tower_http=info,sqlx=warn
      - key: DATABASE_URL
        fromDatabase:
          name: customerops-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: FRONTEND_ORIGIN
        value: https://visionroute-customerops.vercel.app
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: admin@visionroute.app
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        value: VisionRoute Admin

# Render Blueprint — VisionRoute Customer Ops API + Postgres
# Deploy: https://dashboard.render.com/blueprints/new?repo=https%3A%2F%2Fgithub.com%2Frushvill%2FVisionroute-CustomerOps
#
# When applying the blueprint, set BOOTSTRAP_ADMIN_PASSWORD (12+ chars).
# After first successful admin login, delete that env var from the service.

databases:
  - name: customerops-db
    plan: free
    databaseName: customerops
    user: customerops
    region: oregon

services:
  - type: web
    name: customerops-api
    runtime: docker
    plan: free
    # Keep API near the DB (Oregon). Cross-region free stacks often hang/fail.
    region: oregon
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: RUST_LOG
        value: customer_ops_api=info,tower_http=info,sqlx=warn
      - key: DATABASE_URL
        fromDatabase:
          name: customerops-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: FRONTEND_ORIGIN
        value: https://visionroute-customerops.vercel.app
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: admin@visionroute.app
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        value: VisionRoute Admin

# Render Blueprint — VisionRoute Customer Ops API + Postgres
# https://render.com/docs/blueprint-spec
#
# After first deploy:
# 1. Set FRONTEND_ORIGIN to your Vercel URL (https://….vercel.app)
# 2. Set BOOTSTRAP_ADMIN_PASSWORD (12+ chars), restart once, log in, then delete it

databases:
  - name: customerops-db
    plan: free
    databaseName: customerops
    user: customerops

services:
  - type: web
    name: customerops-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: RUST_LOG
        value: customer_ops_api=info,tower_http=info,sqlx=warn
      - key: DATABASE_URL
        fromDatabase:
          name: customerops-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        value: VisionRoute Admin
